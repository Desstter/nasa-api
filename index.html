<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NASA Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="stars"></div>

    <div id="container">
        <header>
            <h1>NASA Explorer</h1>
            <p class="subtitle">Astronomy Picture of the Day</p>
            <div id="imageContainer">
                <div class="loader" id="apodLoader"></div>
            </div>
            <div id="copyright"></div>
        </header>

        <hr>

        <main>
            <article class="articleContainer" id="marsArticle" role="button" tabindex="0" aria-label="Open Mars Weather">
                <div class="card-overlay">
                    <h3>Mars Weather</h3>
                    <p class="card-desc">Current conditions on the Red Planet</p>
                </div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/0/02/OSIRIS_Mars_true_color.jpg" alt="Mars" class="card-img">
            </article>

            <article class="articleContainer" id="neoArticle" role="button" tabindex="0" aria-label="Open Near Earth Objects">
                <div class="card-overlay">
                    <h3>Near Earth Objects</h3>
                    <p class="card-desc">Asteroids approaching Earth today</p>
                </div>
                <img src="https://images-assets.nasa.gov/image/PIA15627/PIA15627~medium.jpg" alt="Near Earth asteroid" class="card-img">
            </article>
        </main>
    </div>

    <!-- Mars Weather Modal -->
    <div id="marsModal" class="modal" role="dialog" aria-modal="true" aria-label="Mars Weather">
        <div class="modal-content">
            <button class="modal-close" id="marsClose" aria-label="Close Mars Weather">&times;</button>
            <h2>Mars Weather</h2>
            <div id="marsWeather" aria-live="polite">
                <div class="loader" id="marsLoader"></div>
            </div>
            <p class="mars-fallback">
                Data from NASA's Curiosity rover. For more details,
                <a href="https://mars.nasa.gov/msl/weather/" target="_blank" rel="noopener">
                    view Mars Weather on NASA &#8599;
                </a>
            </p>
        </div>
    </div>

    <!-- NEO Modal -->
    <div id="neoModal" class="modal" role="dialog" aria-modal="true" aria-label="Near Earth Objects">
        <div class="modal-content">
            <button class="modal-close" id="neoClose" aria-label="Close Near Earth Objects">&times;</button>
            <h2>Near Earth Objects</h2>
            <p id="neoCount" class="neo-count"></p>
            <div class="loader" id="neoLoader"></div>
            <div id="neo"></div>
        </div>
    </div>

    <script src="script.js?v=20261007"></script>
</body>
</html>
